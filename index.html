<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azio Dottore</title>
<style>
:root{--bg:#0b1a22;--p:#131a20;--p2:#1a232b;--ln:#4a5560;--tx:#e8ecef;--mu:#8f9aa3;--g:#4ad07a;--r:#e0504a;--a:#e8b04a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--tx);min-height:100vh;
background:linear-gradient(180deg,#1f6a80 0,#10303c 40%,#0b1a22 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}

.sp{flex:1}.btn{background:#1c252d;border:1px solid var(--ln);padding:6px 12px;border-radius:3px;font-size:12px}

.top{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:stretch}
.ab{width:84px;text-align:center;padding:6px 4px}.ab b{font-size:11px;display:block;color:var(--mu)}
.ab .m{font-size:24px;font-weight:700;border:1px solid var(--ln);border-radius:6px;margin:4px 0;background:#0a0f13}

.hp{min-width:300px;flex:1}.hpn{display:flex;gap:18px;align-items:center;justify-content:center}

.tabs .on{color:var(--tx);border-bottom:2px solid var(--a)}

#side .kv{margin:2px 0}#side .kv b{color:var(--mu);font-weight:500;margin-right:4px}

.empty2{color:var(--mu);margin-top:40vh;text-align:center}
.chk{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid var(--a);background:none;vertical-align:middle;margin-right:4px;padding:0}.chk.on{background:var(--a)}

.xp{min-width:200px}.xp .bar{margin:2px 0}.xc{display:flex;gap:4px}.xc input{width:70px;background:#0a0f13;border:1px solid var(--ln);color:var(--tx);padding:4px;border-radius:3px;text-align:center}
.sec{margin:14px 0 6px;color:var(--mu);font-size:12px;border-bottom:1px solid #2c363f;padding-bottom:3px;font-weight:600}
table.at{width:100%;border-collapse:collapse;font-size:13px}.at th{font-size:10px;color:var(--mu);text-align:left;padding:3px 6px}
.at td{padding:6px;border-bottom:1px solid #263039;vertical-align:middle}.at tr[data-act]:hover,.ch2:hover{background:#1d2830;cursor:pointer}.at tr.sel{background:#243542}
.at small,.mast,.ft small{color:var(--mu)}.at .v{display:inline-block;min-width:42px;text-align:center;border:1px solid var(--ln);border-radius:4px;padding:1px 6px;background:#0a0f13;font-weight:600}
.aic{margin:10px 0;padding:6px 10px;border:1px solid #2c363f;border-radius:4px}.aic b{display:block;margin-bottom:4px}
.ch{cursor:pointer;border-bottom:1px dotted var(--mu)}.ch:hover{color:var(--a)}.mast p{margin:8px 0;color:var(--tx);font-size:13px}
.invh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.addrow{display:flex;gap:4px;flex-wrap:wrap}.addrow .t{width:auto;flex:1;min-width:90px}
.gh{margin:8px 0 4px;color:var(--mu)}.ft{margin:8px 0 12px}.ft p{margin:4px 0;font-size:13px}.chl{border-left:2px solid var(--ln);padding-left:10px;margin:6px 0;font-size:13px}
.ed{min-height:20px;outline:0;border-radius:3px;padding:1px 3px;white-space:pre-wrap}.ed:focus{background:#0a0f13}.ed:empty::before{content:attr(data-ph);color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.grid b{display:block;font-size:11px}@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.ent2{display:flex;gap:6px;align-items:flex-start;margin:4px 0}.ent2 .ed{flex:1}.add{background:none;border:0;color:var(--tx);padding:4px 0}.add:hover{color:var(--a)}
select.t{width:auto}
</style></head><body>

return h+`<div class="sec">+ Add Equipment</div><div class="addrow"><input class="t" id="inn" placeholder="Nama"><input class="t" id="inw" type="number" placeholder="Berat (lb)"><input class="t" id="inq" type="number" placeholder="Qty" value="1"><input class="t" id="inc" type="number" placeholder="Harga (gp)"><select class="t" id="ins"><option value="eq">Equipment</option><option value="pack">Backpack</option><option value="quiver">Quiver</option><option value="attune">Attunement</option><option value="other">Other</option></select><button class="btn g" data-act="addinv">Add</button></div>`}
function feat(){const f=S.sub.feat;let h=filt("feat",[["all","ALL"],["class","CLASS FEATURES"],["species","SPECIES TRAITS"],["feat","FEATS"]]);
FT().filter(g=>f=="all"||g.c==f).forEach(g=>{h+=sec({class:"CLASS FEATURES",species:"SPECIES TRAITS",feat:"FEATS"}[g.c])+`<h4 class="gh">${g.g}</h4>`;
g.i.forEach(x=>{h+=`<div class="ft"><b>${x.n}</b> • <i>${x.s}</i>${x.d?x.d.split("\n").map(p=>`<p>${esc(p)}</p>`).join(""):""}${x.ch.length?`<div class="chl">${x.ch.map(c=>`<div>${esc(c)}</div>`).join("")}</div>`:""}</div>`})});return h}
const ed=(k,ph,v)=>`<div class="ed" contenteditable data-act="fld" data-k="${k}" data-ph="${ph}">${esc(v||"")}</div>`;
function bg(){const f=S.sub.bg,F=S.f,sh=k=>f=="all"||f==k;let h=filt("bg",[["all","ALL"],["bg","BACKGROUND"],["ch","CHARACTERISTICS"],["ap","APPEARANCE"]]);
if(sh("bg"))h+=sec("BACKGROUND")+`<h4 class="gh">Criminal</h4><div class="ft"><b>Criminal</b> • <i>Origin feat: Alert</i><div class="chl"><div>Skills: Sleight of Hand, Stealth</div><div>Tool: Thieves' Tools</div></div></div>`;
if(sh("ch")){h+=sec("CHARACTERISTICS")+`<div class="grid">${[["align","ALIGNMENT"],["gender","GENDER"],["eyes","EYES"],["size","SIZE"],["height","HEIGHT"],["faith","FAITH"],["hair","HAIR"],["skin","SKIN"],["age","AGE"],["weight","WEIGHT"]].map(([k,n])=>`<div><b>${n}</b>${ed(k,"–",F[k])}</div>`).join("")}</div><hr>`;
h+=[["pt","Personality Traits"],["ideals","Ideals"],["bonds","Bonds"],["flaws","Flaws"]].map(([k,n])=>`<div class="ft"><b>${n}</b>${ed(k,"+ Add "+n,F[k])}</div>`).join("")}
if(sh("ap"))h+=sec("APPEARANCE")+ed("app","+ Add Appearance information",F.app);return h}
function notes(){const f=S.sub.notes;let h=filt("notes",[["all","ALL"],["org","ORGS"],["ally","ALLIES"],["enemy","ENEMIES"],["back","BACKSTORY"],["other","OTHER"]]);
[["org","Organizations"],["ally","Allies"],["enemy","Enemies"],["back","Backstory"],["other","Other"]].forEach(([k,n])=>{if(f!="all"&&f!=k)return;
h+=sec(n.toUpperCase())+S.nt[k].map((t,i)=>`<div class="ent2"><div class="ed" contenteditable data-act="nt" data-k="${k}" data-i="${i}" data-ph="Tulis catatan...">${esc(t)}</div><button class="x" data-act="delnt" data-k="${k}" data-i="${i}" aria-label="Hapus">✕</button></div>`).join("")+`<button class="add" data-act="addn" data-k="${k}">+ Add ${n}</button>`});return h}
function extra(){const L=S.ent.extra;return L.map((e,i)=>`<div class="ent"><h4><span contenteditable data-act="et" data-i="${i}">${esc(e.t)}</span><button class="x" data-act="del" data-i="${i}" aria-label="Hapus">✕</button></h4><div class="tx" contenteditable data-act="ex" data-i="${i}">${esc(e.x)}</div></div>`).join("")+`<input class="t" id="et" placeholder="Judul"><textarea class="t" id="ex" rows="3" placeholder="Isi"></textarea><button class="btn g" data-act="addent">Tambah</button>`}
function tabs(){const T=[["actions","ACTIONS",actions],["inv","INVENTORY",inv],["feat","FEATURES & TRAITS",feat],["bg","BACKGROUND",bg],["notes","NOTES",notes],["extra","EXTRAS",extra]];
return `<div class="tabs">${T.map(([k,n])=>`<button class="${S.tab==k?"on":""}" data-act="tab" data-id="${k}">${n}</button>`).join("")}</div>`+T.find(t=>t[0]==S.tab)[2]()}
function view(){
PB=Math.ceil(S.lvl/4)+1;const hpP=Math.max(0,Math.min(100,S.hp/S.max*100)),nx=S.lvl<20?XPT[S.lvl]:null,xpP=nx?Math.min(100,(S.xp-XPT[S.lvl-1])/(nx-XPT[S.lvl-1])*100):100;
let h=`<header><div><h1>Azio dottore</h1><small>Human Rogue ${S.lvl} · Criminal</small></div>
<div class="xp"><small>LVL ${S.lvl}${nx?" · LVL "+(S.lvl+1):" · MAX"}</small><div class="bar"><i style="width:${xpP}%;background:var(--a)"></i></div><small>${S.xp} / ${nx||"MAX"} XP</small></div>
<span class="xc"><input id="xpa" type="number" min="1" value="100" aria-label="Jumlah XP"><button class="btn g" data-act="addxp">+ XP</button><button class="btn g" data-act="lvup">Level Up</button><button class="btn" data-act="lvdn" aria-label="Turunkan level">−</button></span><span class="sp"></span>
<button class="btn" data-act="short">Short Rest</button><button class="btn" data-act="long">Long Rest</button><button class="btn r" data-act="reset">Reset</button></header>
<div class="top">${Object.keys(AB).map(k=>`<div class="box ab"><b>${k}</b><div class="m">${sg(mod(AB[k]))}</div><span class="s">${AB[k]}</span></div>`).join("")}
<div class="box stat"><b>Proficiency</b><span>${sg(PB)}</span></div><div class="box stat"><b>Speed</b><span>30 ft</span></div>
<div class="box stat"><b>Initiative</b><span>${sg(mod(AB.DEX)+PB)}</span></div><div class="box stat"><b>Armor Class</b><span>15</span></div><div class="box stat"><b>Hit Dice</b><span>${S.lvl}d8</span></div>
<div class="box stat"><b>Heroic Inspiration</b><button class="chk ${S.insp?"on":""}" data-act="insp" aria-label="Heroic Inspiration"></button></div>
<div class="box hp"><div class="hpn"><div>Current<span>${S.hp}</span></div><div>Max<span>${S.max}</span></div><div>Temp<span>${S.tmp||"--"}</span></div></div><div class="bar"><i style="width:${hpP}%"></i></div>
<div class="hpc"><button class="btn g" data-act="heal">Heal</button><input id="amt" type="number" min="1" value="1" aria-label="Jumlah"><button class="btn r" data-act="dmg">Damage</button><button class="btn" data-act="temp">+Temp</button><button class="btn" data-act="setmax">Max</button></div></div></div>
<div class="cols"><div><div class="box"><h3>Saving Throws</h3>${Object.keys(AB).map(a=>`<div class="row" data-act="open" data-id="sv-${a}"><span class="dot ${PROF_SAVE.includes(a)?"l1":""}"></span><span class="n">${a}</span><span class="v">${sg(save_(a))}</span></div>`).join("")}</div>
<div class="box" style="margin-top:12px"><h3>Senses</h3>${["Perception","Insight","Investigation"].map(n=>`<div class="row"><span class="v">${pas(n)}</span><span class="n">Passive ${n}</span></div>`).join("")}</div>
<div class="box" style="margin-top:12px"><h3>Proficiencies</h3><div class="row" data-act="open" data-id="prof"><span class="n">Armor, Weapons, Tools, Languages <small>klik untuk detail</small></span></div></div></div>
<div class="box"><h3>Skills (klik lingkaran: kosong → proficient → expertise)</h3>${SK.map(s=>`<div class="row" data-act="open" data-id="sk-${s[0]}"><button class="dot l${S.lv[s[0]]||0}" data-act="lv" data-id="${s[0]}" aria-label="Proficiency ${s[0]}"></button><small>${s[1]}</small><span class="n">${s[0]}</span><span class="v">${sg(sk(s))}</span></div>`).join("")}</div>
<div class="box c3">${tabs()}</div></div>`;
$("#main").innerHTML=h;$("#side").innerHTML=sel?`<button class="btn" data-act="close" style="float:right">Tutup</button>${sel.html}`:`<div class="empty2">Klik item, skill, atau serangan untuk melihat penjelasan.</div>`}
function setSel(id){let o=null;const hit=sg(4+PB);
const a=ATK.find(x=>"a-"+x.n==id);if(a)o=`<h2>${a.n}</h2><em>${a.t}</em><hr><div class="kv"><b>Range</b>${a.r} ft.</div><div class="kv"><b>Hit</b>${hit}</div><div class="kv"><b>Damage</b>${a.d}</div><div class="kv"><b>Notes</b>${a.nt||"-"}</div><hr><p>${a.desc}</p>`;
const c=ACT.find(x=>"c-"+x.n==id);if(c)o=`<h2>${c.n}</h2><em>${{action:"Action",bonus:"Bonus Action",reaction:"Reaction",other:"Other"}[c.tag]} in Combat</em><hr><p>${c.desc}</p>`;
if(id=="o-sneak")o=`<h2>Sneak Attack</h2><em>Rogue · Special</em><hr><div class="kv"><b>Damage</b>${Math.ceil(S.lvl/2)}d6</div><p>Once per turn, extra damage to a creature you hit if you have Advantage and use a Finesse or Ranged weapon, or if an ally is within 5 ft. of the target (not Incapacitated) and you don't have Disadvantage.</p>`;
if(id.startsWith("sk-")){const s=SK.find(x=>x[0]==id.slice(3)),l=S.lv[s[0]]||0;o=`<h2>${s[0]}</h2><em>${s[1]} · ${["Not proficient","Proficient","Expertise"][l]}</em><hr><div class="kv"><b>Bonus</b>${sg(sk(s))}</div><p>${s[1]} modifier (${sg(mod(AB[s[1]]))}) + Proficiency (${sg(PB)}) × ${l}. Click the circle beside the skill to change its status.</p>`}
if(id.startsWith("sv-")){const x=id.slice(3);o=`<h2>${x} Saving Throw</h2><em>${PROF_SAVE.includes(x)?"Proficient":"Not proficient"}</em><hr><div class="kv"><b>Bonus</b>${sg(save_(x))}</div>`}
if(id=="prof")o=`<h2>Proficiencies</h2><hr><div class="kv"><b>Armor</b>Light</div><div class="kv"><b>Weapons</b>Hand crossbow, Rapier, Scimitar, Shortsword, Simple, Whip</div><div class="kv"><b>Tools</b>Thieves' Tools</div><div class="kv"><b>Languages</b>Common, Deep Speech, Draconic, Elvish, Thieves' Cant</div>`;
if(id.startsWith("i-")){const i=S.items.find(x=>"i-"+x.id==id);if(i)o=`<h2>${esc(i.n)}</h2><em>${esc(i.sub)}</em><hr><div class="kv"><b>Weight</b>${i.w} lb.</div><div class="kv"><b>Qty</b>${i.q}</div><div class="kv"><b>Cost</b>${gp(i.c)} gp</div><div class="kv"><b>Notes</b>${esc(i.nt)||"-"}</div><hr><button class="btn r" data-act="delinv" data-id="${i.id}">Hapus item</button>`}
sel=o?{id,html:o}:null}
const amt=()=>Math.max(0,parseInt($("#amt").value)||0),V=s=>$(s).value.trim();
document.addEventListener("click",e=>{
const el=e.target.closest("[data-act]");if(!el||el.matches("[contenteditable],input,select"))return;
const a=el.dataset.act,id=el.dataset.id,k=el.dataset.k;let re=true;
if(a=="open")setSel(id);else if(a=="close")sel=null;
else if(a=="lv"){e.stopPropagation();S.lv[id]=((S.lv[id]||0)+1)%3;if(sel&&sel.id=="sk-"+id)setSel(sel.id)}
else if(a=="tab")S.tab=id;else if(a=="fl")S.sub[k]=id;
else if(a=="heal")S.hp=Math.min(S.max,S.hp+amt());
else if(a=="dmg"){let n=amt(),t=Math.min(S.tmp,n);S.tmp-=t;n-=t;S.hp=Math.max(0,S.hp-n)}
else if(a=="temp")S.tmp=Math.max(S.tmp,amt());
else if(a=="setmax"){const n=amt();if(n>0){S.max=n;S.hp=Math.min(S.hp,n)}}
else if(a=="addxp"){S.xp+=Math.max(0,parseInt($("#xpa").value)||0);while(S.lvl<20&&S.xp>=XPT[S.lvl])levelUp()}
else if(a=="lvup")levelUp();
else if(a=="lvdn"){if(S.lvl>1){const g=5+mod(AB.CON);S.lvl--;S.max=Math.max(1,S.max-g);S.hp=Math.min(S.hp,S.max);S.xp=XPT[S.lvl-1]}}
else if(a=="insp")S.insp=!S.insp;else if(a=="luck")S.luck=S.luck>id?+id:+id+1;else if(a=="sneak")S.sneak=!S.sneak;
else if(a=="long"){S.hp=S.max;S.tmp=0;S.luck=2;S.insp=true}
else if(a=="reset"){if(confirm("Reset semua data ke awal?")){localStorage.removeItem(KEY);location.reload()}re=false}
else if(a=="qty"){const i=S.items.find(x=>x.id==id);i.q=Math.max(0,i.q+ +el.dataset.v)}
else if(a=="eqp"){const i=S.items.find(x=>x.id==id);i.on=!i.on}
else if(a=="delinv"){S.items=S.items.filter(x=>x.id!=id);sel=null}
else if(a=="addinv"){const n=V("#inn");if(n)S.items.push({id:S.nid++,n,sub:"Gear",w:+V("#inw")||0,q:+V("#inq")||1,c:+V("#inc")||0,nt:"",sec:$("#ins").value,on:false})}
else if(a=="addn"){S.nt[k].push("");save();view();const L=document.querySelectorAll(`[data-act=nt][data-k=${k}]`);L[L.length-1].focus();return}
else if(a=="delnt")S.nt[k].splice(+el.dataset.i,1);
else if(a=="addent"){const t=V("#et"),x=V("#ex");if(t||x)S.ent.extra.push({t:t||"Tanpa judul",x})}
else if(a=="del")S.ent.extra.splice(+el.dataset.i,1);
else re=false;
save();if(re)view()});
document.addEventListener("input",e=>{if(e.target.id=="sq"){S.q=e.target.value;save();view();const s=$("#sq");s.focus();s.setSelectionRange(s.value.length,s.value.length)}});
document.addEventListener("focusout",e=>{const el=e.target,a=el.dataset.act,i=+el.dataset.i;
if(a=="fld")S.f[el.dataset.k]=el.innerText.trim();
if(a=="nt")S.nt[el.dataset.k][i]=el.innerText.trim();
if(a=="et")S.ent.extra[i].t=el.textContent;if(a=="ex")S.ent.extra[i].x=el.innerText;
if(a=="money")S[el.dataset.id]=parseInt(el.value)||0;save()});
view();
</script></body></html>
